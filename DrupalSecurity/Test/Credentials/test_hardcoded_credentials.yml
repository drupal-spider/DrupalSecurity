# Test fixture for HardcodedCredentialsSniff
# Lines marked "should trigger" have hardcoded credentials.
# Lines marked "safe" should NOT trigger errors.

# --- Should trigger errors ---
database:
  default:
    password: 'SuperSecret123!'
    driver: mysql

smtp_settings:
  smtp_password: 's3ndgr1d_p@ss'
  smtp_host: smtp.example.com

api:
  api_key: 'ak_live_1234567890abcdef'
  api_secret: 'sk_live_abcdef1234567890'
  api_token: 'tok_abc123xyz'

oauth:
  client_secret: 'oauth-client-secret-value'
  oauth_secret: 'my-oauth-secret'
  consumer_secret: 'consumer-secret-val'

cloud:
  aws_secret_access_key: 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'
  aws_access_key_id: 'AKIAIOSFODNN7EXAMPLE'
  azure_key: 'azure-storage-key-value'

tokens:
  access_token: 'ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
  auth_token: 'xoxb-000000000000-000000000000-xxxxxxxxxxxx'
  bearer_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.test'

crypto:
  private_key: '/path/to/private/key/is/still/a/string'
  encryption_key: 'base64encodedencryptionkey=='

mail:
  mail_password: 'mailgun-password-123'

# Suppressed with phpcs:ignore — won't trigger errors.
ignored_settings:
  password: 'ignored-hardcoded-password' # phpcs:ignore DrupalSecurity.Credentials.HardcodedCredentials.HardcodedCredential
  api_key: 'ignored-api-key' # phpcs:ignore

# Drupal Key module config (key.key.*.yml with config provider stores plaintext).
key_module_trigger:
  key_provider: config
  key_provider_settings:
    key_value: 'my-super-secret-key-stored-in-config'

# --- Should NOT trigger errors (safe) ---
safe_settings:
  password: ''
  api_key: ''
  secret: 'changeme'
  title: 'My Website'
  description: 'A Drupal site'
  hostname: 'db.example.com'
  port: 3306

environment_refs:
  password: '%env(DB_PASSWORD)%'
  api_key: '${API_KEY}'

placeholder_values:
  password: 'TODO'
  api_key: 'xxx'
  secret: 'none'
  auth_token: 'example'
  smtp_password: 'your_password_here'

# Drupal Key module with non-config provider (no hardcoded value).
key_module_safe:
  key_provider: file
  key_provider_settings:
    key_value: ''

# key.key.*.yml with easy_encrypted provider: value is an encrypted blob, not a
# plaintext secret, and 'value' is intentionally not in the credential pattern.
key_module_encrypted:
  key_provider: easy_encrypted
  key_provider_settings:
    value: c75a41cbae54a939b4b58d9d5152d16a1c5ec424b974b60a9f957a112f1899102
    encryption_key_id: 0d2dc7d9_5a39_49d2_8db5_6c771c5dd4d7

# key.key.*.yml with env provider: stores the env variable name, not the secret.
key_module_env:
  key_provider: env
  key_provider_settings:
    env_variable: DDEV_USER
    base64_encoded: false
    strip_line_breaks: true

# easy_encryption.keys.yml — stores key references (UUIDs), not secrets.
active_encryption_key_id: 0d2dc7d9_5a39_49d2_8db5_6c771c5dd4d7
encryption_keys:
  -
    encryption_key_id: 0d2dc7d9_5a39_49d2_8db5_6c771c5dd4d7
